<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephoria - Acceso Administrador</title>
    <style>
        :root {
            --rosa-principal: #ff4d94;
            --rosa-claro: #fff0f5;
            --rosa-acento: #d1105a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: var(--rosa-claro);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .contenedor-login {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: var(--rosa-acento); margin-bottom: 10px; font-size: 1.8rem; }
        p { color: #777; font-size: 0.9rem; margin-bottom: 25px; }
        .input-grupo { margin-bottom: 20px; text-align: left; }
        label { display: block; color: #555; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 1rem;
        }
        input:focus { border-color: var(--rosa-principal); }
        button {
            width: 100%;
            background: linear-gradient(45deg, var(--rosa-principal), var(--rosa-acento));
            color: white;
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.02); }
        .error-msg { color: red; font-size: 0.9rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="contenedor-login">
        <h2>Panel Administrativo 💻</h2>
        <p>Inicia sesión para revisar los datos de contacto.</p>
        
        <form id="loginForm">
            <div class="input-grupo">
                <label>Usuario:</label>
                <input type="text" id="usuario" placeholder="Ej: admin" required>
            </div>
            <div class="input-grupo">
                <label>Contraseña:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Ingresar</button>
            <div class="error-msg" id="error">❌ Usuario o contraseña incorrectos.</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            // AQUÍ defines cuál quieres que sea tu usuario y contraseña
            if (user === 'admin' && pass === '12345') {
                // Si es correcto, te manda al panel de la base de datos
                window.location.href = 'admin.php';
            } else {
                // Si es falso, muestra el error en rojo
                errorDiv.style.display = 'block';
            }
        });
    </script>

</body>
</html>
