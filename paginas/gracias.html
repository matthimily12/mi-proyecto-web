<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ephoria - ¡Gracias!</title>
    <style>
        body {
            background-color: #fff0f5;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .mensaje-exito {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            max-width: 400px;
        }
        h1 {
            color: #d1105a;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-volver {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(45deg, #ff4d94, #d1105a);
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-volver:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="mensaje-exito">
        <h1>✨ ¡Mensaje Enviado! ✨</h1>
        <p>Gracias por contactarte con Ephoria. Hemos recibido tu mensaje correctamente en nuestra base de datos.</p>
        <a href="index2.html" class="btn-volver">Volver a Contactos</a>
    </div>

</body>
</html>
