<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ephoria - Video Promocional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #fff5f8;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background-color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
        }

            nav a {
                text-decoration: none;
                color: #d1105a;
                font-weight: bold;
                margin: 0 15px;
                padding: 8px 15px;
                border-radius: 5px;
                transition: 0.3s;
            }

                nav a:hover {
                    background-color: #fce4ec;
                }

        h2 {
            text-align: center;
            color: #d1105a;
            margin-top: 20px;
            font-size: 1.5em;
        }

        .contenedor-video {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        video {
            border: 5px solid white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Catálogo</a>
        <a href="#">Precios</a>
        <a href="#">Contacto</a>
    </nav>

    <h2>Descubre la Experiencia Ephoria ✨</h2>

    <div class="contenedor-video">
        <video width="854" height="480" controls autoplay muted loop>
            <source src="../videos/maquillaje.mp4" type="video/mp4">
        </video>
    </div>

</body>
</html>
